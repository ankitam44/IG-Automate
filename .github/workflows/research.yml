name: Research Agent (weekly strategy update)

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python agents/research_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit updated strategy
        run: |
          git config user.name "ig-automate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/strategy.json config/niche.json
          git diff --cached --quiet || git commit -m "chore: update content strategy [automated]"
          git push
