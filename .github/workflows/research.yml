name: Research Agent (weekly strategy update)

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: TEMP DEBUG - list models this Groq key can actually use
        run: |
          python3 -c "
          import json, os, urllib.request
          req = urllib.request.Request(
              'https://api.groq.com/openai/v1/models',
              headers={'Authorization': f'Bearer {os.environ[\"GROQ_API_KEY\"]}', 'User-Agent': 'ig-automate/1.0'},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
          for m in data.get('data', []):
              print(m['id'])
          "
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: python agents/research_agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit updated strategy
        run: |
          git config user.name "ig-automate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/strategy.json config/niche.json
          git diff --cached --quiet || git commit -m "chore: update content strategy [automated]"
          git push
